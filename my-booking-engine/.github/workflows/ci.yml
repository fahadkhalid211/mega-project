name: CI Code Standards & Linting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  phpcs-and-analysis:
    name: PHP Standards & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, intl
          tools: composer:v2, phpcs

      - name: Cache Composer Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate PHP Syntax (php -l)
        run: |
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} +

      - name: Run PHPCS (WordPress Coding Standards)
        run: |
          composer global require "wp-coding-standards/wpcs" "dealerdirect/phpcodesniffer-composer-installer"
          phpcs --standard=WordPress my-booking-engine.php includes/ templates/ -n --report=checkstyle || true

      - name: Generate Translation Template (.pot)
        run: |
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          ./wp-cli.phar i18n make-pot . languages/my-booking-engine.pot --slug=my-booking-engine
